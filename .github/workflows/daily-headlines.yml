name: Daily AI Headlines

on:
  schedule:
    # 11:00 UTC — adjust the hour if you want it ready earlier/later in your timezone
    - cron: '0 11 * * *'
  workflow_dispatch: {} # lets you click "Run workflow" manually to test

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch headlines
        run: node scripts/fetch-headlines.js

      - name: Commit updated headlines
        run: |
          git config user.name "headlines-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/headlines.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Update headlines: $(date -u +'%Y-%m-%d')"
          git push
